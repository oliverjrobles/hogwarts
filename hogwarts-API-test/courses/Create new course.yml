info:
  name: Create new course
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/courses
  body:
    type: json
    data: |-
      {
        "name": "Potions",
        "teacher_id": 1,
        "student_ids": [1, 2, 3]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
