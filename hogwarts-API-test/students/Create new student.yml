info:
  name: Create new student
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/students
  body:
    type: json
    data: |

      {
        "name": "Harry Potter",
        "house_id": 1,
        "birthday": "1980-07-31",
        "school_year": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
